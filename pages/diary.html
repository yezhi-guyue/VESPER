<style>
  /* 毛玻璃年块 */

  .pbody .wh i{width:10px;height:10px;flex:none;background:#e6b23c;-webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linejoin=%22round%22><path d=%22M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z%22/></svg>') center/contain no-repeat;mask:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linejoin=%22round%22><path d=%22M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z%22/></svg>') center/contain no-repeat}
  .pbody .wl{display:inline-flex;align-items:center;gap:5px;margin-top:10px;margin-right:7px;padding:3px 9px 3px 7px;border-radius:999px;font-size:9.5px;letter-spacing:0;color:#a2546e;background:rgba(226,96,138,.12);border:1px solid rgba(226,96,138,.24)}
  .pbody .wl i{width:10px;height:10px;flex:none;background:#e2608a;-webkit-mask-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.7%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 20.3C12 20.3 4.6 15.6 4.6 10.6A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.4 3.2c0 5-7.4 9.7-7.4 9.7z%22/></svg>');mask-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.7%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 20.3C12 20.3 4.6 15.6 4.6 10.6A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.4 3.2c0 5-7.4 9.7-7.4 9.7z%22/></svg>')}

  .editMask{position:fixed;inset:0;z-index:230;display:none;align-items:center;justify-content:center;background:rgba(30,30,30,.38)}
  .editMask.on{display:flex}
  .editBox{
    width:86%;max-width:340px;aspect-ratio:1/1;
    background:#fff;border-radius:22px;
    padding:18px 16px 12px;display:flex;flex-direction:column;
    box-shadow:0 20px 50px -18px rgba(0,0,0,.45);
  }
  .editBox .ebT{flex:none;font-size:10px;letter-spacing:.28em;color:#000;margin-bottom:10px}
  .editBox input{flex:none;border:0;background:none;outline:none;font:inherit;font-size:16px;color:#000;padding:6px 0 8px;border-bottom:1px solid rgba(0,0,0,.12)}
  .editBox textarea{flex:1;min-height:0;border:0;background:none;outline:none;resize:none;font:inherit;font-size:13px;line-height:1.9;color:#000;padding:10px 0 0}
  .editBox input::placeholder,.editBox textarea::placeholder{color:#9a9a9a}
  .editBox .ebF{flex:none;display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;letter-spacing:.14em;color:#333}
  .editBox .ebF span{padding:8px 10px}
  .editBox .ebF #edOk{color:#fff;background:#2f2f2f;border-radius:999px;padding:8px 16px}

  body{animation:din .3s ease both}
  @keyframes din{from{opacity:.72}to{opacity:1}}
  .bg{opacity:0;transition:opacity .45s ease}
  .bg.on{opacity:1}
  .post{transition:transform .16s ease,opacity .16s ease}
  .post.tapping{transform:scale(.986);opacity:.9}

  .viewer{
    position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#fffdfb 0%,#fdf8f2 60%,#fbf5ee 100%);
    transform:translateX(100%);pointer-events:none;
    transition:transform .46s cubic-bezier(.32,0,.24,1);
  }
  .viewer.on{transform:none;pointer-events:auto}
  .vbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
  .vbar span{font-size:12px;letter-spacing:.2em;color:#333;padding:6px 4px}
  #vDone{display:none;background:#2f2f2f;color:#fff;border-radius:999px;padding:9px 18px;font-weight:400;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .viewer.new #vDone{display:inline-block}
  .vholder{flex:1;display:flex;padding:2px 12px 0;min-height:0}
  .vsheet{
    flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;
    border-radius:18px 18px 6px 6px;padding:20px 18px 14px;
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 40px -26px rgba(0,0,0,.45);
    background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(0,0,0,.045) 33px 34px);
    background-position:0 66px;
  }
  .vsheet::before{content:'';position:absolute;left:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,rgba(0,0,0,.045),rgba(0,0,0,0));pointer-events:none}
  .vsheet .dtag{align-self:flex-start;font-size:9.5px;letter-spacing:.14em;color:#333;background:rgba(0,0,0,.05);padding:4px 10px;border-radius:999px}
  .vsheet .vttl{width:100%;border:0;background:none;outline:none;font:inherit;font-size:21px;color:#000;line-height:34px;padding:12px 0 0}
  .vsheet .vttl::placeholder,.vsheet .vbody::placeholder{color:#9a9a9a}
  .vsheet .vhr{flex:none;height:1px;background:rgba(0,0,0,.1);margin:10px 0 14px}
  .vsheet .vbody{flex:1;width:100%;min-height:0;border:0;background:none;outline:none;resize:none;font:inherit;font-size:14px;line-height:34px;color:#000;padding:0}
  .vsheet .vfoot{flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,.07);font-size:9px;letter-spacing:.16em;color:#777}
  .vcolors{flex:none;display:none;align-items:center;gap:10px;justify-content:center;padding:14px 16px 24px}
  .viewer.new .vcolors{display:flex}
  .vcolors .sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 5px rgba(0,0,0,.18)}
  .vcolors .sw.on{box-shadow:0 0 0 2px #555}

</style>

<script src="s.js?v=7"></script>
<script>
(function(){
  const LKEY='hearth_days_log';

  let mine=S_.store(LKEY,[]);
  const list=document.getElementById('list');
  const cnt=document.getElementById('cnt');
  const tip=document.getElementById('tip');
  const closed={};

  const CN='〇一二三四五六七八九';
  function cnYear(y){
    return String(y).split('').map(function(c){ return CN[+c]; }).join('');
  }
  function save(){ S_.setStore(LKEY,mine); }

  /* ---- 别人替我写的日记：读 diary_add.json ---- */
  var NEWURL='./diary_add.json';
  var DSYNC='hearth_diary_sync';
  function pullDiary(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET', NEWURL+'?t='+Date.now(), true);
      x.onload=function(){
        if(x.status!==200 && x.status!==0) return;
        var o=null;
        try{ o=JSON.parse(x.responseText); }catch(e){ return; }
        if(!(o instanceof Array) || !o.length) return;
        var seen=parseInt(localStorage.getItem(DSYNC)||'0',10)||0;
        var max=seen, added=0, i, k;
        for(i=0;i<o.length;i++){
          var it=o[i];
          if(!it || !it.ts || it.ts<=seen) continue;
          var dup=false;
          for(k=0;k<mine.length;k++){ if(mine[k].id===it.id){ dup=true; break; } }
          if(!dup){
            mine.push({ id: it.id || ('m'+it.ts), d: it.d || todayStr(), t: it.t || '(没有标题)', s: it.s || '', ts: it.ts, paper:'a' });
            added++;
          }
          if(it.ts>max) max=it.ts;
        }
        if(max>seen){ try{ localStorage.setItem(DSYNC,String(max)); }catch(e){} }
        if(added){ save(); if(typeof render==='function') render(); }
      };
      x.send();
    }catch(e){}
  }
  pullDiary();
  setInterval(pullDiary, 5000);

  /* 打开这一页就等于看过了：把小红点抹掉 */
  (function(){
    function markSeen(){
      try{
        var x=new XMLHttpRequest();
        x.open('GET','./diary_add.json?t='+Date.now(),true);
        x.onload=function(){
          if(x.status!==200 && x.status!==0) return;
          var o=null; try{ o=JSON.parse(x.responseText); }catch(e){ return; }
          if(!(o instanceof Array)) return;
          var mx=0; for(var k=0;k<o.length;k++){ if(o[k] && o[k].ts>mx) mx=o[k].ts; }
          if(mx>0){ try{ localStorage.setItem('hearth_diary_seen',String(mx)); }catch(e){} }
        };
        x.send();
      }catch(e){}
    }
    setTimeout(markSeen, 600);
  })();



  /* 年 / 月 的折叠状态 */
  var closedY={}, closedM={};
  var curTab='all';
  var q='';

  var WKEY='hearth_diary_who';
  var WHO=S_.store(WKEY,{aiName:'夜凪',meName:'悦悦',aiAv:'',meAv:''});
  if(!WHO.aiName) WHO.aiName='夜凪';
  if(!WHO.meName) WHO.meName='悦悦';
  function saveWho(){ S_.setStore(WKEY,WHO); }
  window.__meName=function(){ return WHO.meName; };
  function paintTabs(){
    var t=document.querySelectorAll('#tabs span');
    if(t.length>=3){ t[1].textContent=WHO.meName+' 写 的'; t[2].textContent=WHO.aiName+' 写 的'; }
  }


  var ST=S_.store('hearth_diary_ui',{liked:{},saved:{}});
  if(!ST.liked) ST.liked={};
  if(!ST.saved) ST.saved={};
  function saveST(){ S_.setStore('hearth_diary_ui',ST); }

  window.__dLike=function(kind,id,on){
    if(on){ ST[kind][id]=1; } else { delete ST[kind][id]; }
    saveST();
  };
  window.__dGet=function(id){
    for(var i=0;i<mine.length;i++){ if(mine[i].id===id) return mine[i]; }
    var P=S_.store('hearth_diary_patch',{});
    if(P[id]) return {id:id,t:P[id].t,s:P[id].s};
    var D=S_.DAYS||[];
    for(var k=0;k<D.length;k++){ if(D[k].id===id) return D[k]; }
    return null;
  };
  window.__dDel=function(id){
    if(id&&id.indexOf('u')===0){
      mine=mine.filter(function(x){ return x.id!==id; });
      save(); render();
      return;
    }
    var H=S_.store('hearth_diary_hide',[]);
    if(H.indexOf(id)<0) H.push(id);
    S_.setStore('hearth_diary_hide',H);
    render();
  };
  window.__dEdit=function(id,t,s){
    if(id&&id.indexOf('u')===0){
      for(var i=0;i<mine.length;i++){
        if(mine[i].id===id){ mine[i].t=t; if(s){ mine[i].s=s; } else { delete mine[i].s; } }
      }
      save(); render();
      return;
    }
    var P=S_.store('hearth_diary_patch',{});
    P[id]={t:t,s:s||''};
    S_.setStore('hearth_diary_patch',P);
    render();
  };

  function hhmm(ts){
    var d=new Date(ts||Date.now());
    return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }

  function esc(t){
    return String(t==null?'':t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function avatarUrl(){
    try{
      var d=JSON.parse(localStorage.getItem('hearth_inner_v1')||'{}');
      return d&&d.avL? d.avL : '';
    }catch(e){ return ''; }
  }

  (function(){
    var inp=document.getElementById('sInput');
    var mag=document.getElementById('sMag');
    if(!inp) return;
    inp.addEventListener('input',function(){
      q=(inp.value||'').trim();
      render();
    });
    if(mag) mag.addEventListener('click',function(){
      if(q){ q=''; inp.value=''; render(); }
      inp.focus();
    });
  })();

  function render(){
    var HIDE=S_.store('hearth_diary_hide',[]);
    var PATCH=S_.store('hearth_diary_patch',{});
    const base=(S_.DAYS||[]).filter(function(it){ return HIDE.indexOf(it.id)<0; });
    var all=base.concat(mine).map(function(it){
      var pa=PATCH[it.id];
      return pa? {id:it.id,d:it.d,t:pa.t,s:pa.s} : it;
    }).slice().sort(function(a,b){ return a.d<b.d?1:-1; });
    if(curTab==='mine') all=all.filter(function(it){ return it.id && it.id.indexOf('u')===0; });
    if(curTab==='yours') all=all.filter(function(it){ return !(it.id && it.id.indexOf('u')===0); });
    if(curTab==='like') all=all.filter(function(it){ return !!ST.liked[it.id]; });
    if(curTab==='save') all=all.filter(function(it){ return !!ST.saved[it.id]; });
    if(q){
      var qq=q.toLowerCase();
      all=all.filter(function(it){
        return String(it.t||'').toLowerCase().indexOf(qq)>=0
            || String(it.d||'').indexOf(qq)>=0;
      });
    }
    if(cnt) cnt.textContent=all.length+'天';

    if(!all.length){
      list.innerHTML='<div class=empty>还没有记下的日子</div>';
      return;
    }

    var years=[], yMap={};
    all.forEach(function(it){
      var p=(it.d||'').split('-');
      var y=p[0]||'', m=p[1]||'00';
      if(!yMap[y]){ yMap[y]={y:y,months:[],mMap:{}}; years.push(yMap[y]); }
      var Y=yMap[y];
      if(!Y.mMap[m]){ Y.mMap[m]={m:m,items:[]}; Y.months.push(Y.mMap[m]); }
      Y.mMap[m].items.push(it);
    });

    var h='';
    years.forEach(function(Y,yi){
      var n=0; Y.months.forEach(function(M){ n+=M.items.length; });
      var yOpen=(closedY[Y.y]===undefined)?(yi===0):!closedY[Y.y];

      h+='<div class=ywrap data-y='+Y.y+(yOpen?'':' data-closed=1')+'>';
      h+='<div class=yr><b>'+cnYear(Y.y)+'</b><span class=ln></span><i>'+Y.y+' · '+n+' 条</i><em class=chev>⌄</em></div>';
      h+='<div class=year-body>';

      Y.months.forEach(function(M){
        var key=Y.y+'-'+M.m;
        var mOpen=(closedM[key]===undefined)?true:!closedM[key];
        h+='<div class=mwrap'+(mOpen?'':' data-closed=1')+'>';
        h+='<div class=mo><b>'+(+M.m)+'月</b><span class=ln></span><em class=chev>⌄</em></div>';
        h+='<div class=month-body>';

        M.items.forEach(function(it){
          var pp=(it.d||'').split('-');
          var isMine=it.id&&it.id.indexOf('u')===0;
          h+='<div class=post data-id='+it.id+(isMine?' data-mine=1':'')+'>';
          h+='<div class=phead><span class=av></span>'+
             '<span class=pname>'+(isMine? esc(WHO.meName) : esc(WHO.aiName))+'</span>'+
             '<span class=pdate>'+pp[1]+'.'+pp[2]+(it.ts? ' · '+hhmm(it.ts):'')+'</span></div>';
          h+='<div class=pbody><div class=pt>'+esc(it.t)+'</div>'+
             (it.s? '<div class=ps>'+esc(it.s)+'</div>' : '')+
             (it.pics&&it.pics.length? '<div class=px>'+it.pics.map(function(u){return '<img src="'+u+'">';}).join('')+'</div>' : '')+
             (ST.liked[it.id]? '<div class=wl><i></i>'+esc(WHO.meName)+'点赞了</div>' : '')+
             (ST.saved[it.id]? '<div class=wh><i></i>'+esc(WHO.meName)+'收藏了</div>' : '')+
             '</div>';

          h+='<div class=pfoot>'+
             '<span class=lk'+(ST.liked[it.id]?' data-on=1':'')+'><i class=ic></i>喜欢</span>'+
             '<span class=sv'+(ST.saved[it.id]?' data-on=1':'')+'><i class=ic></i>收藏</span>'+
             '<span class=more>···</span></div>';
          h+='</div>';
        });

        h+='</div></div>';
      });

      h+='</div></div>';
    });

    list.innerHTML=h;

    var els=list.querySelectorAll('.post');
    for(var i=0;i<els.length;i++){
      var el=els[i];
      var mineItem = el.getAttribute('data-mine')==='1';
      var u = mineItem ? WHO.meAv : WHO.aiAv;
      var box = el.querySelector('.av');
      if(box && u) box.style.backgroundImage='url('+u+')';
    }
    paintTabs();
  }


  /* 新建与编辑都去内页，这里不再需要表单逻辑 */

  var tabsEl=document.getElementById('tabs');
  if(tabsEl) tabsEl.addEventListener('click',function(e){
    var sp=e.target.closest && e.target.closest('[data-tab]');
    if(!sp) return;
    var allS=tabsEl.querySelectorAll('span');
    for(var i=0;i<allS.length;i++) allS[i].classList.remove('on');
    sp.classList.add('on');
    curTab=sp.getAttribute('data-tab')||'all';
    render();
  });

  /* 设置：谁写的、各用什么头像 */
  var setMask=document.getElementById('setMask');
  var SWD='hearth_note_diary';
  function diarySwOn(){ try{ return (localStorage.getItem(SWD)||'1')!=='0'; }catch(e){ return true; } }
  (function(){
    var el=document.getElementById('swDiary');
    if(!el) return;
    function paint(){ el.classList.toggle('on', diarySwOn()); }
    el.addEventListener('click',function(){
      try{ localStorage.setItem(SWD, diarySwOn()? '0':'1'); }catch(e){}
      paint();
    });
    paint();
  })();

  var setOpen=document.getElementById('setOpen');
  var nmAi=document.getElementById('nmAi'), nmMe=document.getElementById('nmMe');
  var avAi=document.getElementById('avAi'), avMe=document.getElementById('avMe');
  var picIn=document.getElementById('picIn');
  var pickTarget=null;
  function paintSet(){
    if(!setMask) return;
    nmAi.value=WHO.aiName||'';
    nmMe.value=WHO.meName||'';
    avAi.style.backgroundImage = WHO.aiAv? 'url('+WHO.aiAv+')' : '';
    avMe.style.backgroundImage = WHO.meAv? 'url('+WHO.meAv+')' : '';
  }
  if(setOpen) setOpen.addEventListener('click',function(e){
    e.preventDefault(); paintSet(); setMask.classList.add('on');
  });
  if(setMask){
    document.getElementById('setCancel').addEventListener('click',function(){ setMask.classList.remove('on'); });
    setMask.addEventListener('click',function(e){ if(e.target===setMask) setMask.classList.remove('on'); });
    avAi.addEventListener('click',function(){ pickTarget='ai'; picIn.click(); });
    avMe.addEventListener('click',function(){ pickTarget='me'; picIn.click(); });
    picIn.addEventListener('change',function(){
      var f=this.files&&this.files[0]; if(!f) return; this.value='';
      var fr=new FileReader();
      fr.onload=function(ev){
        var img=new Image();
        img.onload=function(){
          var max=200,w=img.width,h=img.height;
          if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          var d=c.toDataURL('image/jpeg',0.82);
          if(pickTarget==='ai'){ WHO.aiAv=d; avAi.style.backgroundImage='url('+d+')'; }
          else { WHO.meAv=d; avMe.style.backgroundImage='url('+d+')'; }
        };
        img.src=ev.target.result;
      };
      fr.readAsDataURL(f);
    });
    document.getElementById('setOk').addEventListener('click',function(){
      WHO.aiName=(nmAi.value||'').trim()||'夜凪';
      WHO.meName=(nmMe.value||'').trim()||'悦悦';
      saveWho(); setMask.classList.remove('on');
      if(window.__paintBookNames) window.__paintBookNames();
      render();
    });
  }

  var viewer=document.getElementById('viewer');
  var vsheet=document.getElementById('vsheet');
  var vDate=document.getElementById('vDate');
  var vTitle=document.getElementById('vTitle');
  var vBody=document.getElementById('vBody');
  var vWho=document.getElementById('vWho');
  var vTime=document.getElementById('vTime');
  var vDone=document.getElementById('vDone');
  var vColors=document.getElementById('vColors');
  var VCOLORS=['#ffffff','#faf7f2','#f2f2f2','#fdf0f2','#f8f2e6','#eef3f7','#eef4ee'];
  var vPaper=S_.store('hearth_diary_paper','#ffffff');
  if(VCOLORS.indexOf(vPaper)<0) vPaper='#ffffff';
  function vPaint(c){
    vsheet.style.background=c+' repeating-linear-gradient(180deg,transparent 0 33px,rgba(0,0,0,.045) 33px 34px)';
    vsheet.style.backgroundPosition='0 0, 0 66px';
    vsheet.style.backgroundRepeat='no-repeat, repeat';
    var sws=vColors.querySelectorAll('.sw');
    for(var i=0;i<sws.length;i++) sws[i].classList.toggle('on', sws[i].getAttribute('data-c')===c);
  }
  VCOLORS.forEach(function(c){
    var d=document.createElement('span');
    d.className='sw'; d.setAttribute('data-c',c); d.style.background=c;
    d.addEventListener('click',function(){ vPaper=c; S_.setStore('hearth_diary_paper',c); vPaint(c); });
    vColors.appendChild(d);
  });

  function fmtDate(dstr){
    var p=(dstr||'').split('-');
    var W=['日','一','二','三','四','五','六'];
    var wd=W[new Date(+p[0],(+p[1])-1,+p[2]).getDay()];
    return (+p[0])+' 年 '+(+p[1])+' 月 '+(+p[2])+' 日 · 星期'+wd;
  }
  function todayStr(){
    var d=new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  }
  function drawPics(list){
    var box=document.getElementById('vPics');
    if(!box) return;
    box.innerHTML='';
    if(!list || !list.length) return;
    for(var i=0;i<list.length;i++){
      var im=document.createElement('img');
      im.src=list[i];
      box.appendChild(im);
    }
  }

  function openView(item){
    viewer.classList.remove('new');
    viewer.setAttribute('data-id',item.id);
    vDate.textContent=fmtDate(item.d);
    vTitle.value=item.t||''; vBody.value=item.s||'';
    drawPics(item.pics);
    vTitle.readOnly=true; vBody.readOnly=true;
    vWho.textContent=((isMineItem(item)? WHO.meName : WHO.aiName)||'')+' 写的';
    vTime.textContent=item.ts? hhmm(item.ts)+' 写' : '';
    vPaint(item.paper&&VCOLORS.indexOf(item.paper)>=0? item.paper : '#ffffff');
    viewer.classList.add('on');
  }
  function openNew(){
    viewer.classList.add('new');
    viewer.removeAttribute('data-id');
    vDate.textContent=fmtDate(todayStr());
    vTitle.value=''; vBody.value='';
    drawPics(null);
    vTitle.readOnly=false; vBody.readOnly=false;
    vWho.textContent=(WHO.meName||'')+' 写的';
    vTime.textContent=hhmm(Date.now())+' 写';
    vPaint(vPaper);
    viewer.classList.add('on');
    setTimeout(function(){ try{ vTitle.focus(); }catch(e){} },400);
  }
  function closeView(){
    viewer.classList.remove('on');
    setTimeout(function(){ viewer.classList.remove('new'); },500);
  }
  document.getElementById('vClose').addEventListener('click',closeView);
  vDone.addEventListener('click',function(){
    var t=vTitle.value.trim(), s2=vBody.value.trim();
    if(!t && !s2){ closeView(); return; }
    if(!t) t='(没有标题)';
    var list=S_.store('hearth_days_log',[]);
    list.push({id:'u'+Date.now(),d:todayStr(),t:t,s:s2,ts:Date.now(),paper:vPaper});
    S_.setStore('hearth_days_log',list);
    mine=S_.store('hearth_days_log',[]);
    closeView();
    curTab='all';
    var ts2=document.querySelectorAll('#tabs span');
    for(var i=0;i<ts2.length;i++) ts2[i].classList.toggle('on', i===0);
    render();
  });
  var addBtn=document.getElementById('addNew');
  if(addBtn) addBtn.addEventListener('click',function(e){ e.preventDefault(); location.href='diary_view.html?t='+Date.now()+'&id=new'; });
  window.__openView=openView;


  render();
})();
</script>

<script>
(function(){
  var list=document.getElementById('list');
  if(!list) return;
  var menu=document.getElementById('dmMenu');
  var curId=null;

  list.addEventListener('click',function(e){
    var t=e.target;

    var yr=t.closest && t.closest('.yr');
    if(yr){ yr.parentNode.toggleAttribute('data-closed'); return; }

    var mo=t.closest && t.closest('.mo');
    if(mo){ mo.parentNode.toggleAttribute('data-closed'); return; }

    var lk=t.closest && t.closest('.lk');
    if(lk){
      e.preventDefault();
      var postL=lk.closest('.post');
      var pid=postL.getAttribute('data-id');
      var onL=lk.toggleAttribute('data-on');
      window.__dLike('liked',pid,onL);
      var pbL=postL.querySelector('.pbody');
      if(pbL){
        var oldL=pbL.querySelector('.wl');
        if(onL && !oldL){
          var wlEl=document.createElement('div');
          wlEl.className='wl';
          wlEl.innerHTML='<i></i>'+((window.__meName&&window.__meName())||'我')+'点赞了';
          var whEl=pbL.querySelector('.wh');
          if(whEl) pbL.insertBefore(wlEl,whEl); else pbL.appendChild(wlEl);
        } else if(!onL && oldL){ oldL.remove(); }
      }
      if(!onL && curTab==='like'){
        var cEl2=document.getElementById('cnt');
        if(cEl2){ var nn2=parseInt(cEl2.textContent,10); if(!isNaN(nn2)&&nn2>0) cEl2.textContent=(nn2-1)+'天'; }
        if(postL.parentNode) postL.parentNode.removeChild(postL);
      }
      return;
    }

    var sv=t.closest && t.closest('.sv');
    if(sv){
      e.preventDefault();
      var postEl=sv.closest('.post');
      var pid2=postEl.getAttribute('data-id');
      var on2=sv.toggleAttribute('data-on');
      window.__dLike('saved',pid2,on2);
      var pbody=postEl.querySelector('.pbody');
      if(pbody){
        var oldw=pbody.querySelector('.wh');
        if(on2 && !oldw){
          var dw=document.createElement('div');
          dw.className='wh';
          dw.innerHTML='<i></i>'+((window.__meName&&window.__meName())||'我')+'收藏了';
          pbody.appendChild(dw);
        } else if(!on2 && oldw){ oldw.remove(); }
      }
      if(!on2 && curTab==='save'){
        var cEl=document.getElementById('cnt');
        if(cEl){ var nn=parseInt(cEl.textContent,10); if(!isNaN(nn)&&nn>0) cEl.textContent=(nn-1)+'天'; }
        if(postEl.parentNode) postEl.parentNode.removeChild(postEl);
      }
      return;
    }

    var more=t.closest && t.closest('.more');
    if(more){
      e.preventDefault();
      curId=more.closest('.post').getAttribute('data-id');
      menu.classList.add('on');
      return;
    }

    var post=t.closest && t.closest('.post');
    if(post){
      e.preventDefault();
      var pid3=post.getAttribute('data-id');
      var it2=window.__dGet? window.__dGet(pid3) : null;
      location.href='diary_view.html?t='+Date.now()+'&id='+encodeURIComponent(pid3);
    }
  });

  menu.addEventListener('click',function(e){
    var act=e.target.getAttribute && e.target.getAttribute('data-act');
    if(!act) return;
    menu.classList.remove('on');
    if(act==='close') return;
    if(act==='del'){
      if(!curId) return;
      var dm=document.getElementById('delMask');
      if(dm) dm.classList.add('on');
      return;
    }

  });


  var dmask=document.getElementById('delMask');
  var dok=document.getElementById('delOk');
  var dno=document.getElementById('delNo');
  function dclose(){ if(dmask) dmask.classList.remove('on'); }
  if(dok) dok.addEventListener('click',function(){
    dclose();
    if(curId){ window.__dDel(curId); curId=null; }
  });
  if(dno) dno.addEventListener('click',function(){ dclose(); });
  if(dmask) dmask.addEventListener('click',function(e){ if(e.target===dmask) dclose(); });

  var a=document.getElementById('backA');
  function goBack(){
    try{ if(window.self===window.top && window.history.length>1){ window.history.back(); return; } }catch(e0){}

    if(window.self!==window.top){
      var pd=null;
      try{ pd=window.parent.document; }catch(err){ pd=null; }
      if(pd){
        var w=pd.querySelector('.pgwrap');
        if(w){
          var pg=w.querySelector('.pg');
          if(pg) pg.classList.remove('on');
          w.classList.remove('on');
          setTimeout(function(){ if(w && w.parentNode) w.parentNode.removeChild(w); },800);
          try{ window.parent.postMessage({t:'hearth:back'},'*'); }catch(e1){}
          return;
        }
        if(pd.querySelector('.door')){
          try{ window.parent.postMessage({t:'hearth:exit'},'*'); }catch(e2){}
          return;
        }
      }else{
        try{ window.parent.postMessage({t:'hearth:back'},'*'); return; }catch(e3){}
      }
      try{ window.top.location.href='inner.html'; return; }catch(e4){}
    }
    location.href='inner.html';
  }
  if(a) a.addEventListener('click',function(e){ e.preventDefault(); goBack(); });
})();
</script>






<script>
(function(){
  var a=document.getElementById('bkAi'), m=document.getElementById('bkMe');
  if(!a||!m) return;
  function paintBookNames(){
    var W={};
    try{ W=JSON.parse(localStorage.getItem('hearth_diary_who')||'{}')||{}; }catch(e){ W={}; }
    a.textContent=(W.aiName||'夜凪')+' 的 日 记 本';
    m.textContent=(W.meName||'悦悦')+' 的 日 记 本';
  }
  window.__paintBookNames=paintBookNames;
  paintBookNames();
  function fadeGo(url){
    document.body.classList.add('fading');
    setTimeout(function(){ location.href=url; },180);
  }
  a.addEventListener('click',function(){ fadeGo('diary_book.html?who=ai'); });
  m.addEventListener('click',function(){ fadeGo('diary_book.html?who=me'); });
})();
</script>
