<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="ls.js"></script>
<script src="bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdfcfa">
<meta name="color-scheme" content="light">
<title>一起听</title>
<style>
  :root{--st:max(env(safe-area-inset-top),30px);--sb:env(safe-area-inset-bottom,0px)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:#fbfcfd;color-scheme:light}
  html,body{overflow:hidden}
  body{
    position:fixed;inset:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;
    -webkit-text-size-adjust:100%;
    color:#474c50;
    background:linear-gradient(#fbfcfd 0%, #f4f6f8 100%);
    background-color:#fbfcfd;
    animation:pin .55s ease both;
  }
  @keyframes pin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- 壁纸 ---------- */
  .wall{
    position:fixed;inset:-6%;z-index:0;pointer-events:none;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    filter:blur(14px) saturate(1.02);
    opacity:0;transition:opacity .6s ease;
  }
  .wall.on{opacity:1}
  .wall::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(251,252,253,var(--wm,.44)),rgba(244,246,248,var(--wm,.54)))}

  /* ---------- 置顶灰栏 ---------- */
  .topbar{
    position:fixed;left:0;right:0;top:0;z-index:20;
    padding:var(--st) 18px 0;
    height:calc(var(--st) + 20px);
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(214,221,227,.94);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 1px 0 rgba(168,180,190,.75);
  }
  .ic{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#5b666e;background:transparent;
    text-decoration:none;
    transform:translateY(-16px);
  }
  .ic svg{width:17px;height:17px;display:block}
  .bnote{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;color:#68727a;pointer-events:none;
  }
  .bnote svg{width:100%;height:100%;display:block}

  /* ---------- 搜索 ---------- */
  .sbwrap{
    position:fixed;left:18px;right:18px;top:calc(var(--st) + 40px);z-index:19;
  }
  .sb{
    display:flex;align-items:center;gap:10px;
    height:37px;padding:0 16px;border-radius:999px;
    background:linear-gradient(180deg, rgba(247,249,251,.96) 0%, rgba(232,237,241,.96) 100%);
    box-shadow:
      0 1px 1px rgba(126,140,152,.10),
      0 6px 16px rgba(126,140,152,.10),
      inset 0 1px 0 rgba(255,255,255,.95),
      0 0 0 1px rgba(203,212,219,.85);
    transition:box-shadow .28s ease, background .28s ease;
  }
  .sb.on{
    background:linear-gradient(180deg, #fdfeff 0%, #f0f4f7 100%);
    box-shadow:
      0 2px 4px rgba(126,140,152,.10),
      0 8px 20px rgba(126,140,152,.14),
      inset 0 1px 0 #ffffff,
      0 0 0 1px rgba(160,175,186,.90);
  }
  .sb input{
    flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;
    -webkit-appearance:none;appearance:none;
    font-family:inherit;font-size:13px;letter-spacing:.1em;color:#3f4a53;
  }
  .sb input::-webkit-search-cancel-button,
  .sb input::-webkit-search-decoration{-webkit-appearance:none;display:none}
  .sb input::placeholder{color:#a8b1b9;letter-spacing:.10em}
  .sb .mg{width:15px;height:15px;flex:none;color:#8c97a1;display:flex;align-items:center;justify-content:center}
  .sb .mg svg{width:100%;height:100%}
  .sb .clr{display:none;flex:none;width:15px;height:15px;border-radius:50%;
    background:rgba(140,151,161,.35);color:#fff;font-size:11px;line-height:15px;text-align:center}
  .sb.on .clr{display:block}

  /* ---------- 内容 ---------- */
  .page{
    position:absolute;inset:0;z-index:2;
    padding:calc(var(--st) + 96px) 18px calc(env(safe-area-inset-bottom) + 150px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .page::-webkit-scrollbar{display:none}

  .secttl{
    font-size:12px;letter-spacing:.22em;text-indent:.22em;color:#8d959c;
    margin:2px 0 14px 4px;
  }
  .secttl .n{letter-spacing:0;color:#c5c0b8;font-size:10px;margin-left:6px}

  /* ---------- 列表 ---------- */
  .row{
    position:relative;display:flex;align-items:center;gap:14px;
    padding:9px 4px;border-radius:16px;
    transition:background .18s ease,transform .18s ease;
  }
  .row:active{background:rgba(255,255,255,.85);transform:scale(.985)}
  .cv{
    position:relative;width:48px;height:48px;flex:none;border-radius:50%;
    background:linear-gradient(150deg,#f3f0ec,#e8e3dc);overflow:hidden;
    box-shadow:0 3px 10px rgba(150,140,125,.14);
  }
  .cv img{width:100%;height:100%;object-fit:cover;display:block}
  .cv.play::after{
    content:'';position:absolute;inset:0;border-radius:50%;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85);
  }
  .tx{flex:1;min-width:0;padding-right:6px}
  .nm{
    font-size:13.5px;letter-spacing:.04em;color:#48443f;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ar{
    margin-top:5px;font-size:11px;letter-spacing:.06em;color:#aaa59e;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row.now .nm{color:#8a6a45}
  .row.now .ar{color:#c0a884}
  .add{
    width:28px;height:28px;flex:none;border:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(238,243,247,.92);color:#a9b4bc;
    font-size:16px;line-height:1;font-family:inherit;
    box-shadow:inset 0 0 0 1px rgba(205,214,221,.9);
    margin-right:2px;transition:background .18s ease,color .18s ease;
  }
  .add:active{background:#e3ebf1;color:#7f8b94}

  /* 分组竖线：像她画的那一道 */
  .grp{position:relative;padding-left:22px;margin-top:6px}
  .grp::before{
    content:'';position:absolute;left:9px;top:-14px;bottom:6px;width:1px;
    background:linear-gradient(rgba(200,190,178,.05),rgba(200,190,178,.5),rgba(200,190,178,.05));
    border-radius:1px;
  }
  .grp .gh{
    font-size:10px;letter-spacing:.42em;text-indent:.42em;color:#bdb7af;
    padding:10px 0 6px 4px;
  }

  .empty{
    text-align:center;color:#bdb7af;font-size:11.5px;letter-spacing:.24em;
    padding:56px 0 40px;
  }

  /* ---------- 底部 tab ---------- */
  .tab{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    height:calc(env(safe-area-inset-bottom) + 58px);
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;align-items:center;
    background:rgba(233,237,240,.84);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 -1px 0 rgba(196,203,209,.60);
  }
  .tab a,.tab b{
    flex:1;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:11px;letter-spacing:.26em;text-indent:.26em;font-weight:400;
    color:#9aa1a7;text-decoration:none;
  }
  .tab b{color:#5f676d}
  .tab>*{position:relative}
  .tab>*+*::before{
    content:'';position:absolute;left:0;top:50%;
    transform:translateY(-50%);
    width:1px;height:18px;
    background:rgba(138,150,161,.45);
  }

  /* ---------- tab 上方的五线谱 ---------- */
  .score{
    position:fixed;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom) + 58px);
    z-index:1;
    width:100%;height:auto;display:block;
    pointer-events:none;user-select:none;
    opacity:.55;
    -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.95) 40%,rgba(0,0,0,0));
    mask-image:linear-gradient(to top,rgba(0,0,0,.95) 40%,rgba(0,0,0,0));
  }

  /* ---------- 迷你播放条 ---------- */
  .mini{
    position:fixed;left:12px;right:12px;
    bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:22;
    display:flex;align-items:center;gap:10px;
    padding:6px 8px 6px 6px;border-radius:999px;
    background:rgba(255,255,255,.94);
    box-shadow:0 8px 24px rgba(120,135,148,.18), 0 0 0 1px rgba(205,214,221,.75);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    visibility:hidden;opacity:0;transform:translateY(14px);
    transition:opacity .3s ease,transform .3s ease,visibility .3s;
  }
  .mini.on{visibility:visible;opacity:1;transform:none}
  .mini .mv{
    width:38px;height:38px;flex:none;border-radius:19px;object-fit:cover;
    background:linear-gradient(150deg,#f0f3f6,#e2e8ed);
  }
  .mini .mi{flex:1;min-width:0}
  .mini .mn{font-size:12.5px;letter-spacing:.03em;color:#3f4a53;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .ma{margin-top:3px;font-size:10.5px;letter-spacing:.05em;color:#9aa3aa;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .mb{
    width:30px;height:30px;flex:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#485259;
  }
  .mini .mb svg{width:13px;height:13px;display:block}
  .mini .pp{width:34px;height:34px;box-shadow:inset 0 0 0 1.5px rgba(72,82,89,.55)}
  .mini .mb:active{background:rgba(210,220,228,.45)}

  /* ---------- 设置弹窗 ---------- */
  .shmask{
    position:fixed;inset:0;z-index:70;
    background:rgba(32,38,44,.28);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .26s ease;
  }
  .shmask.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:50%;top:50%;z-index:71;
    width:min(298px,80vw);
    padding:18px 18px 16px;
    border-radius:20px;
    background:#fefefe;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.9),
      0 0 0 1px rgba(196,206,214,.7),
      0 20px 48px rgba(64,78,90,.22);
    transform:translate(-50%,-50%) scale(.94);
    opacity:0;pointer-events:none;
    transition:opacity .22s ease, transform .28s cubic-bezier(.22,.86,.28,1);
  }
  .sheet.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .shbar{display:none}
  .shttl{
    font-size:13.5px;letter-spacing:.16em;text-indent:.16em;
    color:#4d575e;text-align:center;margin:2px 0 16px;
  }
  .shx{
    position:absolute;right:10px;top:10px;
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#9aa4ac;background:rgba(236,240,243,.9);
    font-size:15px;line-height:1;text-decoration:none;
  }
  .shsec{
    font-size:10.5px;letter-spacing:.16em;
    color:#9aa4ac;margin:0 0 8px 2px;
  }
  .shprev{
    width:100%;aspect-ratio:16/9;height:auto;border-radius:12px;overflow:hidden;
    background-color:#eef2f5;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(196,206,214,.75);
    color:#a6b0b7;font-size:11px;letter-spacing:.12em;
  }
  .shbtns{display:flex;gap:8px;margin:12px 0 0}
  .shbtn{
    flex:1;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;letter-spacing:.06em;
    background:#f4f7f9;color:#515b63;text-decoration:none;
    box-shadow:inset 0 0 0 1px rgba(203,212,219,.85);
    transition:background .18s ease;
  }
  .shbtn:active{background:#e8eef2}
  .shfoot{
    display:flex;align-items:center;gap:8px;
    margin-top:16px;padding-top:14px;
    border-top:1px solid rgba(203,212,219,.7);
  }
  .shfoot .shbtn{box-shadow:none;background:transparent;height:36px;font-size:12.5px;border-radius:11px}
  .shfoot .cancel{
    color:#8b959d;flex:0 0 auto;padding:0 18px;
    background:#fbfcfd;
    border:1px solid rgba(196,206,214,.9);
  }
  .shfoot .cancel:active{background:#eef2f5}
  .shfoot .ok{
    margin-left:auto;flex:0 0 auto;padding:0 24px;
    background:#c7d2da;color:#37434c;
    border:1px solid rgba(180,193,203,.9);
    box-shadow:none;
  }
  .shfoot .ok:active{background:#b8c5ce}
  .shrow{
    display:flex;align-items:center;gap:10px;
    margin-top:12px;
  }
  .shlab{font-size:11px;letter-spacing:.1em;color:#8b959d;flex:0 0 30px}
  .shval{font-size:11px;color:#9aa4ac;flex:0 0 26px;text-align:right;font-variant-numeric:tabular-nums}
  .shrow input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:20px;background:transparent;outline:none;
  }
  .shrow input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:999px;
    background:linear-gradient(90deg,#b9c6cf,#dbe3e9);
  }
  .shrow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:15px;height:15px;border-radius:50%;margin-top:-6px;
    background:#fff;
    box-shadow:0 1px 4px rgba(90,104,116,.35),inset 0 0 0 1px rgba(170,184,194,.9);
  }
  .shrow input[type=range]:disabled{opacity:.4}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);
    transform:translate(-50%,8px);z-index:60;
    padding:9px 18px;border-radius:999px;
    background:rgba(72,78,84,.90);color:#f4f6f8;
    font-size:11.5px;letter-spacing:.2em;
    opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="wall" id="wall"></div>
<input type="file" id="wfile" accept="image/*" style="display:none">

<div class="topbar">
  <a class="ic" href="inner.html" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <a class="ic" href="javascript:;" id="btnSet" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
    </svg>
  </a>
  <span class="bnote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="7" cy="17.6" rx="2.9" ry="2.5" transform="rotate(-18 7 17.6)"/>
      <ellipse cx="18" cy="15.4" rx="2.9" ry="2.5" transform="rotate(-18 18 15.4)"/>
      <path d="M9.7 17.2V7.1L20.7 4.6v10.4"/>
    </svg>
  </span>
</div>

<div class="sbwrap">
  <div class="sb" id="sb">
    <input id="q" type="text" placeholder="搜索歌曲" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
    <span class="clr" id="clr">×</span>
    <span class="mg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    </span>
  </div>
</div>

<div class="page" id="page">
  <div class="secttl" id="ttl">每日推荐</div>
  <div id="list"></div>
  <div id="more"></div>
</div>

<div class="mini" id="mini">
  <img class="mv" id="mCov" alt="">
  <div class="mi" id="mGo">
    <div class="mn" id="mName"></div>
    <div class="ma" id="mArt"></div>
  </div>
  <div class="mb" id="mPrev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5l-9 7 9 7z" fill="currentColor" stroke="none"/><path d="M5.5 5.5v13"/></svg>
  </div>
  <div class="mb pp" id="mPP">
    <svg id="mPPico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="3.4" height="14" rx="1.6" fill="currentColor" stroke="none"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.6" fill="currentColor" stroke="none"/></svg>
  </div>
  <div class="mb" id="mNext">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l9 7-9 7z" fill="currentColor" stroke="none"/><path d="M18.5 5.5v13"/></svg>
  </div>
</div>

<div class="shmask" id="shMask"></div>
<div class="sheet" id="shSheet">
  <a class="shx" href="javascript:;" id="shX">×</a>
  <div class="shttl">设置</div>
  <div class="shsec">一起听的背景</div>
  <div class="shprev" id="shPrev">还没有背景图</div>
  <div class="shrow">
    <span class="shlab">模糊</span>
    <input type="range" id="shBlurIn" min="0" max="30" step="1" value="14">
    <span class="shval" id="shBlurV">14</span>
  </div>
  <div class="shrow">
    <span class="shlab">遮罩</span>
    <input type="range" id="shMaskIn" min="0" max="85" step="1" value="44">
    <span class="shval" id="shMaskV">44</span>
  </div>
  <div class="shbtns">
    <a class="shbtn" href="javascript:;" id="shPick">选一张</a>
    <a class="shbtn" href="javascript:;" id="shClear">用回默认</a>
  </div>
  <div class="shfoot">
    <a class="shbtn cancel" href="javascript:;" id="shCancel">取消</a>
    <a class="shbtn ok" href="javascript:;" id="shOk">确定</a>
  </div>
</div>

<img class="score" src="assets/deco/score.png" alt="">

<div class="tab">
  <b id="tabSearch">搜索</b>
  <a href="listen.html?v=3" id="tabListen">一起听</a>
  <a href="home.html?v=4">主页</a>
</div>

<script>
(function(){
  var API = 'http://127.0.0.1:9090';
  var listEl = document.getElementById('list');
  var moreEl = document.getElementById('more');
  var ttlEl  = document.getElementById('ttl');
  var qEl    = document.getElementById('q');
  var sbEl   = document.getElementById('sb');
  var clrEl  = document.getElementById('clr');
  var timer  = null;

  var AMP = '&'+'amp;', LT = '&'+'lt;', GT = '&'+'gt;', QU = '&#'+'34;', SQ = '&#'+'39;';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return c==='&'?AMP:c==='<'?LT:c==='>'?GT:c==='"'?QU:SQ; }); }

  function cover(c){
    if(!c) return '';
    return '<img src="'+esc(c)+'" loading="lazy" onerror="this.style.display=\'none\'">';
  }

  function render(rows, opts){
    opts = opts || {};
    var box = opts.el || listEl;
    if(!rows || !rows.length){
      box.innerHTML = '<div class="empty">'+(opts.empty||'这 里 空 着')+'</div>';
      return;
    }
    var html = '';
    rows.forEach(function(s, i){
      var id = s.songId || s.id;
       html += '<div class="row" data-id="'+esc(id)+'" data-i="'+i+'">'
            +    '<div class="cv">'+cover(s.cover)+'</div>'
            +    '<div class="tx"><div class="nm">'+esc(s.name||'未 知')+'</div>'
            +      '<div class="ar">'+esc(s.artist||'')+(s.album?' · '+esc(s.album):'')+'</div></div>'
            +    '<button class="add" type="button" data-add="'+i+'" aria-label="加入列表">+</button>'
            +  '</div>';
    });
    box.innerHTML = html;

    Array.prototype.forEach.call(box.querySelectorAll('.row'), function(el){
      el.addEventListener('click', function(){
        var i = +el.getAttribute('data-i');
        startPlay(rows, i);
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll('.add'), function(el){
      el.addEventListener('click', function(ev){
        ev.stopPropagation();
        addToQueue(rows[+el.getAttribute('data-add')]);
      });
    });
  }

  /* ---------- 把一首歌加进一起听的列表 ---------- */
  function addToQueue(s){
    if(!s) return;
    var song = {
      songId: (s.songId != null ? s.songId : s.id),
      name: s.name, artist: s.artist, album: s.album, cover: s.cover
    };
    var key = String(song.songId);
    var dup = false, i;

    /* 一律以盘上的队列为准，本页内存里那份可能是清空之前的旧货 */
    if(window.__LS_RELOAD) window.__LS_RELOAD();
    var q = null;
    try{ q = JSON.parse(localStorage.getItem('hearth_pod_queue') || ''); }catch(e){}
    if(!q || !q.songs) q = { songs: [], at: 0 };

    for(i = 0; i < q.songs.length; i++){
      if(String(q.songs[i].songId != null ? q.songs[i].songId : q.songs[i].id) === key){ dup = true; break; }
    }
    if(!dup){
      q.songs.push(song);
      try{ localStorage.setItem('hearth_pod_queue', JSON.stringify(q)); }catch(e){}
      try{ localStorage.removeItem('hearth_pod_empty'); }catch(e){}
      try{ if(window.__LS_FLUSH) window.__LS_FLUSH(); }catch(e){}
    }

    /* 页内播放队列不动，它只管这个页面里放歌的顺序 */

    toast(dup ? '列 表 里 已 经 有 了' : '已 加 入 列 表');
  }

  function get(url, cb){
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 6000;
    x.onload = function(){
      var d = null;
      try{ d = JSON.parse(x.responseText); }catch(e){}
      cb(d);
    };
    x.onerror = x.ontimeout = function(){ cb(null); };
    x.send();
  }
  function loadRecent(){
    ttlEl.innerHTML = '每日推荐';
    moreEl.innerHTML = '';
    get(API+'/music/netease/daily', function(d){
      var rows = (d && d.songs) ? d.songs : [];
      if(rows.length){
        render(rows, { empty:'今 天 的 推 荐 还 没 好' });
        return;
      }
      get(API+'/music/recent', function(d2){
        var rows2 = (d2 && d2.songs) ? d2.songs : [];
        render(rows2.slice(0, 30), { empty:'还 没 听 过 什 么' });
      });
    });
  }


  function doSearch(kw){
    ttlEl.innerHTML = '搜索';
    get(API+'/music/search?q='+encodeURIComponent(kw)+'&limit=40', function(d){
      if(d && d.songs && d.songs.length){
        render(d.songs, { empty:'没 找 到' });
      }else{
        listEl.innerHTML = '<div class="empty">没 找 到</div>';
      }
    });
  }

  /* ---------- 迷你播放器 ---------- */
  var au = new Audio();
  au.preload = 'auto';

  var mQueue = [], mAt = 0, mCur = null, mPlaying = false;
  var miniEl = document.getElementById('mini');
  var mCovEl = document.getElementById('mCov');
  var mNameEl = document.getElementById('mName');
  var mArtEl = document.getElementById('mArt');
  var mPPico = document.getElementById('mPPico');

  var I_PLAY = '<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>';
  var I_PAUSE = '<rect x="7" y="5" width="3.4" height="14" rx="1.6" fill="currentColor" stroke="none"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.6" fill="currentColor" stroke="none"/>';

  function mPaint(){
    if(!mCur) return;
    if(mCovEl.getAttribute('data-id') !== String(mCur.songId || mCur.id)){
      mCovEl.src = mCur.cover || '';
      mCovEl.setAttribute('data-id', String(mCur.songId || mCur.id));
    }
    mNameEl.textContent = mCur.name || '未知';
    mArtEl.textContent = mCur.artist || '';
    mPPico.innerHTML = mPlaying ? I_PAUSE : I_PLAY;
    miniEl.classList.add('on');
  }

  function mSave(){
    if(!mCur) return;
    try{
      localStorage.setItem('hearth_pod_cur', JSON.stringify({
        id: mCur.songId || mCur.id, name: mCur.name, artist: mCur.artist,
        cover: mCur.cover, t: Math.floor(au.currentTime || 0), at: Date.now()
      }));
      /* 这里不再写 hearth_pod_queue：搜索页放什么歌，不该把一起听那边的列表冲掉 */
    }catch(e){}
  }

  function mSrc(id, ok, fail){
    get(API + '/music/url?id=' + id, function(d){
      var url = (d && d.ok && d.url) ? d.url : null;
      if(!url){ fail && fail(); return; }
      if(url.indexOf('http') !== 0) url = API + url;
      au.src = url;
      au.play().then(ok).catch(function(){
        au.src = API + '/music/file/' + id + '.mp3';
        au.play().then(ok).catch(function(){ fail && fail(); });
      });
    });
  }

  function mPlayAt(i){
    if(!mQueue.length) return;
    mAt = ((i % mQueue.length) + mQueue.length) % mQueue.length;
    mCur = mQueue[mAt];
    mPlaying = true;
    mPaint();
    mSave();
    mSrc(mCur.songId || mCur.id, function(){
      mPlaying = true; mPaint(); mSave();
    }, function(){
      mPlaying = false; mPaint(); toast('这 首 放 不 了');
    });
  }

  function startPlay(rows, i){
    mQueue = rows.map(function(x){
      return { songId: x.songId || x.id, name: x.name, artist: x.artist, album: x.album, cover: x.cover };
    });
    mPlayAt(i);
  }

  au.addEventListener('play', function(){ mPlaying = true; mPaint(); });
  au.addEventListener('pause', function(){ mPlaying = false; mPaint(); mSave(); });
  au.addEventListener('timeupdate', function(){
    var n = Date.now();
    if(n - (au._sv || 0) > 3000){ au._sv = n; mSave(); }
  });
  au.addEventListener('ended', function(){ mPlayAt(mAt + 1); });

  document.getElementById('mPP').addEventListener('click', function(e){
    e.stopPropagation();
    if(!mCur) return;
    if(au.paused){ au.play().catch(function(){}); } else { au.pause(); }
  });
  document.getElementById('mPrev').addEventListener('click', function(e){
    e.stopPropagation();
    mPlayAt(mAt - 1);
  });
  document.getElementById('mNext').addEventListener('click', function(e){
    e.stopPropagation();
    mPlayAt(mAt + 1);
  });
  function goListen(){
    if(!mCur) return;
    mSave();
    try{ if(window.__LS_FLUSH) window.__LS_FLUSH(); }catch(e){}
    var id = String(mCur.songId || mCur.id || '');
    var t = Math.floor(au.currentTime || 0);
    var p = [];
    if(id){
      p.push('play=' + encodeURIComponent(id));
      p.push('t=' + t);
      if(mCur.name) p.push('nm=' + encodeURIComponent(mCur.name));
      if(mCur.artist) p.push('ar=' + encodeURIComponent(mCur.artist));
      if(mCur.cover) p.push('cv=' + encodeURIComponent(mCur.cover));
    }
    location.href = 'listen.html?v=3' + (p.length ? ('&' + p.join('&')) : '');
  }
  document.getElementById('mGo').addEventListener('click', goListen);
  /* 底部 tab 进一起听：只是打开那一页，别把这边正在放的那首硬塞过去 */
  var tabListen = document.getElementById('tabListen');
  if(tabListen){
    tabListen.addEventListener('click', function(){
      mSave();
      try{ if(window.__LS_FLUSH) window.__LS_FLUSH(); }catch(e){}
    });
  }
  /* 整条都算点 只有那几个圆按钮例外 */
  miniEl.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mb,#mGo')) return;
    goListen();
  });

  qEl.addEventListener('focus', function(){ sbEl.classList.add('on'); });
  qEl.addEventListener('blur', function(){ if(!qEl.value) sbEl.classList.remove('on'); });
  qEl.addEventListener('input', function(){
    sbEl.classList.add('on');
    clearTimeout(timer);
    var v = qEl.value.trim();
    if(!v){ loadRecent(); return; }
    timer = setTimeout(function(){ doSearch(v); }, 380);
  });
  clrEl.addEventListener('click', function(){
    qEl.value = ''; sbEl.classList.remove('on'); loadRecent(); qEl.blur();
  });
  document.getElementById('tabSearch').addEventListener('click', function(){
    qEl.focus();
    document.getElementById('page').scrollTop = 0;
  });

  /* ---------- 壁纸 ---------- */
  var wallEl = document.getElementById('wall');
  var fileEl = document.getElementById('wfile');
  var toastEl = null, toastT = null;
  function toast(t){
    if(!toastEl){ toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
    toastEl.textContent = t;
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1600);
  }
  var shMaskEl = document.getElementById('shMask');
  var shSheet = document.getElementById('shSheet');
  var shPrev = document.getElementById('shPrev');
  var shBlurIn = document.getElementById('shBlurIn');
  var shMaskIn = document.getElementById('shMaskIn');
  var shBlurV = document.getElementById('shBlurV');
  var shMaskV = document.getElementById('shMaskV');
  var DEF_BLUR = 14, DEF_MASK = 44;
  var draft = '', draftBlur = DEF_BLUR, draftMask = DEF_MASK;

  function num(v, d, lo, hi){
    var n = parseInt(v, 10);
    if(isNaN(n)) return d;
    return Math.max(lo, Math.min(hi, n));
  }
  function readStore(){
    var o = { wall:'', blur:DEF_BLUR, mask:DEF_MASK };
    try{
      o.wall = localStorage.getItem('hearth_pod_wall') || '';
      o.blur = num(localStorage.getItem('hearth_pod_blur'), DEF_BLUR, 0, 30);
      o.mask = num(localStorage.getItem('hearth_pod_mask'), DEF_MASK, 0, 85);
    }catch(e){}
    return o;
  }
  function renderPrev(u){
    if(!u){ shPrev.style.backgroundImage = ''; shPrev.textContent = '还没有背景图'; return; }
    shPrev.style.backgroundImage = 'url("' + u + '")'; shPrev.textContent = '';
  }
  function applyWall(u){
    if(!u){ wallEl.style.backgroundImage = ''; wallEl.classList.remove('on'); return; }
    wallEl.style.backgroundImage = 'url("' + u + '")';
    wallEl.classList.add('on');
  }
  function applyLook(b, m){
    wallEl.style.filter = 'blur(' + b + 'px) saturate(1.02)';
    wallEl.style.setProperty('--wm', (m / 100).toFixed(2));
  }
  function restoreSaved(){
    var s = readStore();
    draft = s.wall; draftBlur = s.blur; draftMask = s.mask;
    applyWall(s.wall); applyLook(s.blur, s.mask);
    shBlurIn.value = s.blur; shMaskIn.value = s.mask;
    shBlurV.textContent = s.blur; shMaskV.textContent = s.mask;
  }
  function openSheet(){
    restoreSaved();
    renderPrev(draft);
    shMaskEl.classList.add('on'); shSheet.classList.add('on');
  }
  function closeSheet(){ shMaskEl.classList.remove('on'); shSheet.classList.remove('on'); }

  shBlurIn.addEventListener('input', function(){
    draftBlur = +this.value; shBlurV.textContent = draftBlur;
    applyLook(draftBlur, draftMask);
  });
  shMaskIn.addEventListener('input', function(){
    draftMask = +this.value; shMaskV.textContent = draftMask;
    applyLook(draftBlur, draftMask);
  });

  document.getElementById('btnSet').addEventListener('click', openSheet);
  function cancelSheet(){ restoreSaved(); closeSheet(); }
  document.getElementById('shX').addEventListener('click', cancelSheet);
  document.getElementById('shPick').addEventListener('click', function(){ try{ fileEl.click(); }catch(err){} });
  document.getElementById('shClear').addEventListener('click', function(){ draft = ''; renderPrev(''); });
  document.getElementById('shCancel').addEventListener('click', cancelSheet);
  document.getElementById('shOk').addEventListener('click', function(){
    var ok = true;
    try{
      if(draft){ localStorage.setItem('hearth_pod_wall', draft); }
      else{ localStorage.removeItem('hearth_pod_wall'); }
      localStorage.setItem('hearth_pod_blur', String(draftBlur));
      localStorage.setItem('hearth_pod_mask', String(draftMask));
    }catch(e){ ok = false; }
    applyWall(draft); applyLook(draftBlur, draftMask);
    closeSheet();
    if(!ok && draft){ toast('图 太 大 没 存 上'); }
    else{ toast(draft ? '壁 纸 换 好 了' : '已 用 回 默 认'); }
  });
  shMaskEl.addEventListener('click', cancelSheet);

  restoreSaved();

  fileEl.addEventListener('change', function(){
    var f = fileEl.files && fileEl.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 1100, w = img.width, h = img.height;
        if(w > max){ h = Math.round(h * max / w); w = max; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var d = '';
        try{ d = c.toDataURL('image/jpeg', .75); }catch(e2){}
        if(!d){ toast('这 张 图 读 不 了'); return; }
        draft = d;
        renderPrev(d);
        applyWall(d); applyLook(draftBlur, draftMask);
        toast('已 选 好 点 确 定');
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
    fileEl.value = '';
  });

  /* ---- 写盘没完就先别跳页，别让最后几片被掐掉 ---- */
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    if(!h || h.charAt(0) === '#' || h.indexOf('javascript:') === 0) return;
    if(!(window.__LS_BUSY && window.__LS_BUSY())) return;
    e.preventDefault();
    var to = a.href;
    if(window.__LS_WHEN_IDLE) window.__LS_WHEN_IDLE(function(){ location.href = to; });
    else location.href = to;
  }, true);

  loadRecent();
})();
</script>
</body>
</html>
